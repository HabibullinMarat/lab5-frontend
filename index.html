<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система ТОиР - Панель управления</title>
    <!-- Подключаем CSS, который сделает второй разработчик -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Панель управления оборудованием</h1>
    </header>

    <main>
        <!-- Форма добавления (Работа Разработчика А) -->
        <section class="add-form">
            <h2>Добавить новое оборудование</h2>
            <form id="equipmentForm">
                <input type="text" id="equipName" placeholder="Название станка" required>
                <input type="text" id="equipSerial" placeholder="Серийный номер" required>
                <button type="submit">Добавить</button>
            </form>
        </section>

        <!-- Таблица вывода (Структура от Разработчика А) -->
        <section class="equipment-list">
            <h2>Список оборудования</h2>
            <table id="equipTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Наименование</th>
                        <th>Серийный номер</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Данные будут вставляться скриптом -->
                </tbody>
            </table>
        </section>
    </main>

    <script>
        // Скрипт для получения данных с вашего Flask API (из Лабы №3)
        async function fetchEquipment() {
            try {
                const response = await fetch('http://localhost:5000/api/v1/equipment');
                const data = await response.json();
                const tbody = document.querySelector('#equipTable tbody');
                tbody.innerHTML = '';
                
                data.forEach(item => {
                    const row = `<tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.serial_number}</td>
                        <td>В эксплуатации</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Ошибка загрузки данных. Убедитесь, что Flask-сервер запущен.", error);
            }
        }
        // Запускаем загрузку при открытии страницы
        document.addEventListener('DOMContentLoaded', fetchEquipment);
    </script>
</body>
</html>
